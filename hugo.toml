baseURL = ""
locale = "en-US"
title = "Donica Church of God"
#disableKinds = ["taxonomy", "term"]

[markup]
  [markup.highlight]
    style = "github-dark"
    lineNos = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

[security]
  [security.funcs]
    getenv = ["^HUGO_", "^CI$"]

[params]
  availability = " "
  email = ""
  github = ""
  linkedin = ""

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Who We Are"
  pageRef = "/about"
  weight = 20

[[menus.main]]
  name = "Location"
  pageRef = "/location"
  weight = 30

[[menus.main]]
