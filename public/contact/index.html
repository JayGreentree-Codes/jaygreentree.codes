      <h1 class="text-4xl md:text-5xl font-bold tracking-tight bg-gradient-to-br from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
        Contact
      </h1>
      
        <p class="mt-4 text-lg text-slate-400 leading-relaxed">Have a project in mind or want to chat about web architecture? Send a message below or email me directly.</p>
      
    </header>

    <div class="mt-10 space-y-8">
      
      

      
      <form action="https://formspree.io/f/xpzevppa" method="POST" class="space-y-5 p-6 sm:p-8 rounded-2xl bg-slate-900/40 border border-slate-800/80" target="_blank">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Name</label>
          <input type="text" id="name" name="name" required placeholder="Jane Doe"
                 class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email</label>
          <input type="email" id="email" name="email" required placeholder="jane@example.com"
                 class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
        </div>

        <div>
          <label for="message" class="block text-sm font-medium text-slate-300 mb-2">Message</label>
          <textarea id="message" name="message" rows="5" required placeholder="Tell me about your timeline, goals, or project..."
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition"></textarea>
        </div>

        <button type="submit" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-sky-500 text-slate-950 text-sm font-semibold hover:bg-sky-400 transition shadow-lg shadow-sky-500/20 cursor-pointer">
          Send Message
        </button>
      </form>
    </div>
