<!doctype html>
<html lang="{{ site.Language.Locale }}" class="dark scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  {{ with (templates.Defer (dict "key" "global")) }}
    {{ partial "css.html" . }}
  {{ end }}
</head>
<body class="bg-neutral-950 text-neutral-200 antialiased flex flex-col min-h-screen selection:bg-red-500/30 selection:text-red-200">

  <div class="-z-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-red-950/35 via-neutral-950 to-neutral-950"></div>

  {{ partial "nav.html" . }}

  <main class="flex-grow max-w-5xl w-full mx-auto px-6 py-12">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

</body>
</html>
