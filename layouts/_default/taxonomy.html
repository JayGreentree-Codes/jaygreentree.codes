{{ define "main" }}
<section class="mx-auto max-w-4xl px-4 py-12 sm:px-6 lg:px-8">
  <header class="mb-8 border-b border-gray-200 pb-4 dark:border-gray-800">
    <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">
      {{ .Title }}
    </h1>
    {{ with .Content }}
      <div class="mt-2 text-base text-gray-600 dark:text-gray-400">
        {{ . }}
      </div>
    {{ end }}
  </header>

  <ul class="flex flex-wrap gap-3">
    {{ range .Data.Terms.Alphabetical }}
      <li>
        <a 
          href="{{ .Page.RelPermalink }}" 
          class="inline-flex items-center gap-2 rounded-full border border-gray-200 bg-gray-50 px-4 py-2 text-sm font-medium text-gray-700 transition hover:border-blue-500 hover:bg-blue-50 hover:text-blue-700 dark:border-gray-700 dark:bg-gray-800/60 dark:text-gray-200 dark:hover:border-blue-400 dark:hover:bg-gray-800 dark:hover:text-blue-300"
        >
          <span>{{ .Page.Title }}</span>
          <span class="rounded-full bg-gray-200 px-2 py-0.5 text-xs font-semibold text-gray-700 dark:bg-gray-700 dark:text-gray-300">
            {{ .Count }}
          </span>
        </a>
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}
