{{ define "main" }}
<article class="py-12 max-w-2xl">
  <header class="border-b border-neutral-800/80 pb-8">
    <h1
      class="text-4xl md:text-5xl font-bold tracking-tight bg-gradient-to-br from-white via-neutral-200 to-neutral-400 bg-clip-text text-transparent">
      {{ .Title }}
    </h1>
    {{ with .Params.summary }}
    <p class="mt-4 text-lg text-neutral-400 leading-relaxed">{{ . }}</p>
    {{ end }}
  </header>

  <div class="mt-10 space-y-8">
    {{ with site.Params.email }}
    <div
      class="p-6 rounded-2xl bg-neutral-900/50 border border-neutral-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wider text-red-400">Direct Email</span>
        <p class="text-white font-medium mt-1">{{ . }}</p>
      </div>
      <a href="mailto:{{ . }}"
        class="inline-flex items-center justify-center px-4 py-2.5 rounded-xl bg-neutral-800 text-white text-sm font-medium hover:bg-neutral-700 transition">
        Open Mail App ↗
      </a>
    </div>
    {{ end }}

    <form action="{{ .Params.form_action }}" method="POST"
      class="space-y-5 p-6 sm:p-8 rounded-2xl bg-neutral-900/40 border border-neutral-800/80">
      <div>
        <label for="name" class="block text-sm font-medium text-neutral-300 mb-2">Name</label>
        <input type="text" id="name" name="name" required placeholder="Jane Doe"
          class="w-full px-4 py-2.5 rounded-xl bg-neutral-950 border border-neutral-800 text-white placeholder-neutral-500 focus:outline-none focus:border-red-500 transition">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-neutral-300 mb-2">Email</label>
        <input type="email" id="email" name="email" required placeholder="jane@example.com"
          class="w-full px-4 py-2.5 rounded-xl bg-neutral-950 border border-neutral-800 text-white placeholder-neutral-500 focus:outline-none focus:border-red-500 transition">
      </div>

      <div>
        <label for="subject" class="block text-sm font-medium text-neutral-300 mb-2">Subject</label>

        <div class="grid">
          <select id="subject" name="subject"
            class="col-start-1 row-start-1 appearance-none w-full pl-4 pr-10 py-2.5 rounded-xl bg-neutral-950 border border-neutral-800 text-white focus:outline-none focus:border-red-500 transition">
            <option value="" disabled selected>
              ---
            </option>
            <option value="general">
              General Information
            </option>
            <option value="prayer">
              Prayer Request
            </option>
            <option value="visit">
              Plan A Visit
            </option>
            <option value="pastoral">
              Pastoral Care
            </option>
            <option value=""></option>
          </select>

          <!-- Custom Chevron Icon -->
          <svg
            class="col-start-1 row-start-1 pointer-events-none self-center justify-self-end mr-3.5 size-4 text-neutral-400"
            xmlns="http://w3.org" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd" />
          </svg>
        </div>
      </div>


      <div>
        <label for="message" class="block text-sm font-medium text-neutral-300 mb-2">Message</label>
        <textarea id="message" name="message" rows="5" required
          placeholder="Tell me about your timeline, goals, or project..."
          class="w-full px-4 py-2.5 rounded-xl bg-neutral-950 border border-neutral-800 text-white placeholder-neutral-500 focus:outline-none focus:border-red-500 transition"></textarea>
      </div>

      <button type="submit"
        class="w-full sm:w-auto px-6 py-3 rounded-xl bg-red-600 text-white text-sm font-semibold hover:bg-red-500 transition shadow-lg shadow-red-600/20 cursor-pointer">
        Send Message
      </button>
    </form>
  </div>
</article>
{{ end }}
