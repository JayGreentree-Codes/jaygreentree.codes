{{ define "main" }}
  <header class="py-12 border-b border-neutral-800/80">
    <h1 class="text-4xl md:text-5xl font-bold tracking-tight bg-gradient-to-br from-white via-neutral-200 to-neutral-400 bg-clip-text text-transparent">
      {{ .Title | default "Articles" }}
    </h1>
    <p class="mt-4 text-lg text-neutral-400 max-w-2xl">Thoughts on design, software engineering, and building for the web.</p>
  </header>

  <section class="py-10 grid grid-cols-1 gap-4">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="group block p-6 rounded-2xl bg-neutral-900/40 border border-neutral-800/80 hover:border-red-500/40 hover:bg-neutral-900/80 transition">
        <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2">
          <h2 class="text-xl font-semibold text-white group-hover:text-red-300 transition">
            {{ .Title }}
          </h2>
          <time class="text-xs font-medium text-neutral-500 shrink-0">
            {{ .Date.Format "Jan 2, 2006" }} • {{ .ReadingTime }} min read
          </time>
        </div>
        {{ with .Summary }}
          <p class="text-neutral-400 text-sm mt-2 max-w-3xl leading-relaxed">{{ . }}</p>
        {{ end }}
      </a>
    {{ end }}
  </section>
{{ end }}
