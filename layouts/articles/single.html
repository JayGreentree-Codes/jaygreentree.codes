{{ define "main" }}
  <article class="py-12 max-w-3xl">
    <a href="/articles" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-sky-300 transition mb-8">
      ← Back to Articles
    </a>

    <header class="mb-10 border-b border-slate-800/80 pb-8">
      <time class="text-xs font-medium uppercase tracking-wider text-sky-400">
        {{ .Date.Format "January 2, 2006" }} • {{ .ReadingTime }} min read
      </time>
      <h1 class="mt-3 text-3xl md:text-5xl font-bold tracking-tight text-white leading-tight">
        {{ .Title }}
      </h1>
    </header>

    <div class="prose prose-invert prose-slate max-w-none">
      {{ .Content }}
    </div>
  </article>
{{ end }}
